name: Sync upstream

on:
  schedule:
    - cron: '0 2 * * *'        # UTC 02:00 = 北京 10:00
  workflow_dispatch:           # 手动按钮

# 同一时间只运行一次，避免定时触发和手动触发相互覆盖提交。
concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

# GITHUB_TOKEN 需要有推送 release 分支的权限。
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (release)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: release          # ← 重点：检出你自己的 release 分支

      - name: Fetch upstream release
        run: |
          git remote add upstream https://github.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever.git 2>/dev/null || true
          git fetch --no-tags upstream release

      # 上游的 release 是每日重新生成的提交，通常与 fork 的 release 没有
      # 可快进的共同历史。因此不能使用 git merge --ff-only；直接取上游文件，
      # 再恢复本仓库需要保留的规则。
      - name: Apply upstream files and restore local rules
        run: |
          git checkout upstream/release -- .

          grep -q '^GEOIP,CN,DIRECT' sr_cnip.conf || {
            echo 'Could not find the GEOIP rule insertion point in sr_cnip.conf.' >&2
            exit 1
          }

          for rule in \
            'DOMAIN-SUFFIX,podcasts.apple.com,Proxy' \
            'DOMAIN-SUFFIX,bookkeeper.itunes.apple.com,Proxy' \
            'DOMAIN-SUFFIX,play.itunes.apple.com,Proxy' \
            'DOMAIN-SUFFIX,xp.apple.com,Proxy'; do
            if ! grep -Fqx "$rule" sr_cnip.conf; then
              RULE="$rule" perl -0pi -e 's/^(GEOIP,CN,DIRECT.*)$/$ENV{RULE} . "\n" . $1/me' sr_cnip.conf
            fi
          done

      - name: Commit and push changes
        run: |
          if git diff --quiet HEAD; then
            echo 'Already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: sync upstream release"
          git push origin HEAD:release
